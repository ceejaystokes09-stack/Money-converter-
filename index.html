<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert currencies using the latest rates from Frankfurter."
    />
    <title>Currency Converter</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172554;
        background: #eff6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 30rem);
        padding: 2rem;
        border: 1px solid #dbeafe;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 2.5rem rgb(30 64 175 / 10%);
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
      }

      .intro {
        margin: 0.5rem 0 1.5rem;
        color: #475569;
      }

      label {
        display: block;
        margin-bottom: 1rem;
        font-weight: 600;
      }

      input,
      select,
      button {
        width: 100%;
        min-height: 2.75rem;
        margin-top: 0.4rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        font: inherit;
      }

      button {
        border: 0;
        background: #1d4ed8;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #1e40af;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #result {
        margin: 1.25rem 0 0;
        font-size: 1.5rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      #rate-date {
        margin: 0.4rem 0 0;
        color: #475569;
        font-size: 0.9rem;
      }

      #status-message {
        margin: 1rem 0 0;
        color: #b91c1c;
      }

      @media (max-width: 25rem) {
        main {
          padding: 1.25rem;
        }
      }
    </style>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Currency converter</h1>
      <p class="intro">Convert with the latest rates from Frankfurter.</p>
      <form id="converter-form">
        <label for="amount">
          Amount
          <input
            id="amount"
            name="amount"
            type="number"
            min="0.01"
            step="any"
            value="100"
            required
          />
        </label>
        <label for="from-currency">
          From
          <select id="from-currency" name="from" required>
            <option value="">Loading currencies...</option>
          </select>
        </label>
        <label for="to-currency">
          To
          <select id="to-currency" name="to" required>
            <option value="">Loading currencies...</option>
          </select>
        </label>
        <button id="convert-button" type="submit">Convert</button>
      </form>
      <p id="status-message" role="status" hidden></p>
      <p id="result" aria-live="polite" hidden></p>
      <p id="rate-date"></p>
    </main>
  </body>
</html>
